name: Deploy OpenRoom to GitHub Pages

on:
  push:
    branches:
      - arena/385c2232-strip-mod-token
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the publishing branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Read the actual Pages address
        id: pages
        uses: actions/configure-pages@v5
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build, validate and stage public files only
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python scripts/build.py
          python tests/check_site.py
          python scripts/export_site.py
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
